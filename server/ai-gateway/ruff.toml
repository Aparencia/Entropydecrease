# @ai-context
# ruff 规则集配置：锁定为 pyflakes(F) + pycodestyle 错误级(E4/E7/E9)。
# Ruff rule set pinned to pyflakes + pycodestyle errors.
# Why: ruff 默认集随版本扩张（0.16 起纳入 BLE/RUF/UP/DTZ 等风格规则），
#      不显式声明会导致 CI 在依赖升级后突然变红；风格类规则待专项整治后再启用。

target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# 测试文件：允许 fixture 注入产生的未使用导入；
# E402 —— 测试须先 sys.path.insert 注入 ai-gateway 根目录，之后才能导入被测模块
"tests/*" = ["F401", "F403", "F405", "E402"]
# 兼容层 re-export 本质即"未使用导入"
"config/__init__.py" = ["F401"]
"routers/__init__.py" = ["F401"]
