# =============================================================================
# 安全响应头统一片段（可 include 复用）
# =============================================================================
# Why: nginx 的 add_header 继承规则——location 内一旦出现任何 add_header，
# 就不再继承 server 级的 add_header。因此所有自带 add_header 的 location
# （缓存头/CORS 头等）必须显式 include 本片段，否则安全头会在这些路径丢失。
# 新增带 add_header 的 location 时，务必同步 include 本文件。

# HSTS：强制浏览器后续全部走 HTTPS（仅应在 HTTPS server 块内 include）
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# 防点击劫持：禁止被第三方站点以 iframe 嵌入
add_header X-Frame-Options "SAMEORIGIN" always;
# 防 MIME 嗅探：禁止浏览器猜测 Content-Type
add_header X-Content-Type-Options "nosniff" always;
# 限制 Referer 泄露：跨站请求仅携带 origin
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 内容安全策略：官网为静态站（Next.js 静态导出），采用保守基线——
# 默认仅允许同源；样式允许同源与内联（Next.js 静态导出含内联 style）；
# 图片允许同源与 data:（少量 base64 图标）；脚本仅同源（无第三方脚本）。
# 后续如需引入第三方资源，按需最小化放宽，勿回退为 unsafe-eval/*。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
# 注：X-XSS-Protection 已被现代浏览器废弃且可引入新攻击面，不再启用。
