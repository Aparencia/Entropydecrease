
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile on;
    # 配合 sendfile：尽量用满 MSS 发送大文件，减少小包（安装包下载场景收益明显）
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    # 访问日志 & 错误日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
    
    # Gzip 压缩
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=ai:10m rate=30r/m;
    # 安装包下载并发限制（按 IP），避免大文件下载挤占 API 带宽
    limit_conn_zone $binary_remote_addr zone=dl_conn:10m;
    # 全站下载总并发（key 为常量）：防止大量同时下载耗尽连接与带宽
    limit_conn_zone $server_name zone=dl_total:1m;

    # Upstream 后端服务
    upstream ai_gateway {
        server ai-gateway:8000;
    }
    upstream sync_service {
        server sync-service:8080;
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name entropydecrease.com www.entropydecrease.com 121.40.24.242;

        # 域名归属验证与 ACME http-01 挑战必须在 HTTP 下直接可达：
        # 此类验证程序（如阿里云 CDN 域名验证）通常不跟随 301。
        #
        # 关键：nginx 的 server 级 return 在 SERVER_REWRITE 阶段执行，早于
        # location 匹配，若仍将 return 301 置于 server 级，下方 location
        # 永不生效。故重定向必须下移至 location /。
        location = /verification.html {
            root /usr/share/nginx/html;
        }

        # Let's Encrypt webroot 模式续期预留（standalone 模式不受此影响）。
        # 若采用 webroot，需确认 certbot 的 -w 指向宿主机
        # /opt/Entropydecrease/website（即容器内 /usr/share/nginx/html）。
        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # www → 非 www 统一主域（SEO 权重收敛）
    # Why: canonical/sitemap 均以非 www 为准；双域名并存会被搜索引擎视为两个站点，
    #      权重分裂导致排名下降。www 全部 301 至主域。
    server {
        listen 443 ssl;
        server_name www.entropydecrease.com;

        # SSL 证书（由 Certbot / Let's Encrypt 签发，覆盖 www 子域）
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        return 301 https://entropydecrease.com$request_uri;
    }

    # HTTPS 主服务
    server {
        listen 443 ssl;
        server_name entropydecrease.com;

        # SSL 证书（由 Certbot / Let's Encrypt 签发）
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # AI 网关健康检查（转发到 ai-gateway，不可用时降级为 Nginx 自检）
        location /health {
            access_log off;

            # 转发到 ai-gateway 后端（获取真实健康状态）
            proxy_pass http://ai_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            # /health 端点并行 ping 所有 Provider（单个超时 5s），总耗时可能 > 5s，
            # 必须给足余量否则 Nginx 先超时触发 @health_fallback 返回假降级
            proxy_read_timeout 12s;
            proxy_buffering off;
            proxy_request_buffering off;

            # ai-gateway 不可用时降级：返回 degraded 状态
            error_page 502 503 504 = @health_fallback;
        }

        # 健康检查降级 fallback（ai-gateway 不可达时由 Nginx 直接响应）
        # 命名 location 不继承 server 级 add_header，且不经过 FastAPI CORSMiddleware，必须自带 CORS 头
        location @health_fallback {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            return 200 '{"status":"degraded","service":"ai-gateway","version":"unknown","error":"gateway unreachable"}';
        }

        # AI Gateway — 流式输出（SSE 端点，需要更长超时时间）
        location ~* /api/v1/ai/.*/stream {
            limit_req zone=ai burst=5 nodelay;
            proxy_pass http://ai_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            # SSE 必需配置：禁用缓存
            proxy_cache off;
            add_header X-Accel-Buffering no;
        }

        # AI Gateway
        location /api/v1/ai/ {
            limit_req zone=ai burst=5 nodelay;
            proxy_pass http://ai_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
        }

        # AI Gateway — 视觉提取（课堂助手截图分析）
        location /api/v1/vision/ {
            limit_req zone=ai burst=5 nodelay;
            proxy_pass http://ai_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            client_max_body_size 50m;
        }

        # AI Gateway — 多模态分析（课堂助手课后分析）
        location /api/v1/multimodal/ {
            limit_req zone=ai burst=5 nodelay;
            proxy_pass http://ai_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            client_max_body_size 50m;
        }

        # AI Gateway — 语音转写（ASR，上传音频分片）
        location /api/v1/asr/ {
            limit_req zone=ai burst=5 nodelay;
            proxy_pass http://ai_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            client_max_body_size 50m;
        }

        # Sync Service
        location /api/v1/sync/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://sync_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support for sync
        location /ws/ {
            proxy_pass http://sync_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # -----------------------------------------------------------------
        # 安装包下载目录（由 release.yml CI 同步至 /opt/Entropydecrease/downloads）
        # ^~ 阻止服务器级正则 location（如图片/字体规则）抢占匹配；
        # 同时作为 electron-updater generic provider 的更新源
        # -----------------------------------------------------------------
        location ^~ /downloads/ {
            root /usr/share/nginx;
            autoindex off;
            # 接入 CDN 后本路径主要服务 CDN 回源（少量、可信）与少量直连兜底，
            # 不再承载大量用户直接下载，故原限流已只剩副作用：
            # CDN 预热时多个边缘节点并发回源，易撞上并发上限而被拒（503），
            # 导致预热失败或极慢（预热需每节点各拉一份完整文件）。
            # 故移除 limit_rate（回源越快预热越快）并大幅放宽并发；
            # 仍保留上限以防异常爬取耗尽连接。
            limit_conn dl_conn 32;
            limit_conn dl_total 64;

            # 更新元数据（latest.yml / latest.json）禁止缓存，
            # 否则客户端会长期读到旧版本信息；允许 www 子域跨域读取
            location ~* \.(yml|json)$ {
                add_header Cache-Control "no-cache" always;
                add_header Access-Control-Allow-Origin "*" always;
            }
        }

        # -----------------------------------------------------------------
        # 官网静态站点（Next.js 静态导出，由 CI 同步至 /opt/Entropydecrease/website）
        # -----------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            # Next.js 静态导出生成 story.html 形式，需 $uri.html 回退
            try_files $uri $uri.html $uri/ =404;
            error_page 404 /404.html;
        }

        # Next.js 静态资源（带 content hash，可长期缓存）
        location /_next/static/ {
            root /usr/share/nginx/html;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 图片/字体等媒体资源
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }
    }
}
