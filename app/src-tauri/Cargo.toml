[package]
name = "entropydecrease"
version = "0.12.6"
description = "熵减 - 视频知识提取与持久化（本地优先）"
authors = ["Aparencia"]
edition = "2021"
# 多 bin 歧义修复（2026-08-19）：src/bin/asr_forensic.rs 诊断工具引入第二个
# bin 后 cargo run 无法确定默认目标——声明主程序为默认，诊断工具用
# `cargo run --bin asr_forensic -- <wav...>` 显式调用。
default-run = "entropydecrease"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# 隐式 lib test 禁用（2026-08-21 构建修复）：统一由下方显式 [[test]] app_lib_tests
# 承载——其链接经 build.rs 注入 comctl32 v6 manifest（隐式目标无法注入，
# 加载 system32 的 comctl32 5.82 报 0xc0000139）
test = false

# 显式测试目标（2026-08-21 构建修复）：build.rs 的 comctl32 v6 manifest 注入
# 经 cargo:rustc-link-arg-tests 只作用于测试目标；bin test=false——隐式 bin test
# 无测试（0 用例）且链接 tauri-build 的 resource.lib（已含 MANIFEST 资源），
# 重复注入会 CVT1100 duplicate resource。
[[test]]
name = "app_lib_tests"
path = "src/lib.rs"

[[bin]]
name = "entropydecrease"
path = "src/main.rs"
test = false

[[bin]]
name = "asr_forensic"
path = "src/bin/asr_forensic.rs"
test = false

[[bin]]
name = "cer_bench"
path = "src/bin/cer_bench.rs"
test = false

[features]
# ADR-009（v0.4.0 M1）：OCR CUDA EP 编译开关（默认开）——ORT 1.28 官方 gpu_cuda12
# 运行时存在（download-ort-cuda.ps1 分发）；feature 关闭时 CUDA 请求显式失败并
# 回退 CPU（record fallback_reason），保证 CPU-only 环境零 CUDA 依赖。
default = ["ocr-cuda"]
ocr-cuda = ["oar-ocr/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# 三维复审 #8：tauri-plugin-opener 已移除（无外链打开需求，收窄 IPC 攻击面）
tauri-plugin-dialog = "2"
# v0.12.6（ADR-025）：浮窗全局快捷键 Ctrl+Shift+F——锁定（点击穿透）后浮窗
# 自身不可点，主窗又随浮窗隐藏，全局键是唯一自解锁路径（进程级热键，采集中生效）
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }
# v0.12.0 构建修复：sherpa-onnx 由 static（MT 静态库，内嵌 onnxruntime 符号）切 shared
# （DLL 动态链接）——否则与 oar-ocr 的 ort-sys（MD 动态链接 onnxruntime.dll）链接时
# 发生 LNK2038 RuntimeLibrary 冲突 + LNK2005 onnxruntime 符号重复；shared 包
# sherpa-onnx-v1.13.5-win-x64-shared-MT-Release-lib.tar.bz2 在 sherpa-archive/。
oar-ocr = { version = "0.9", default-features = false, features = ["simd", "auto-download"] }
# v0.12.0 构建修复：oar-ocr 关 default（download-binaries 下载 onnxruntime 会请求
# cdn.pyke.io 被 TLS 拦截）——本地 ORT 经 .cargo/config.toml ORT_LIB_LOCATION 链接，
# simd 保留默认推理加速；CUDA 经 ocr-cuda feature（见 [features]）。
# v0.12.1 回归修复：**auto-download 必须保留**——它与 download-binaries 相互独立
# （auto-download = ["oar-ocr-core/auto-download"]，默认不包含）；
# v0.12.0 关 default 时被一并关闭 → 模型注册名（pp-ocrv6_tiny_*）不再解析为
# ModelScope 缓存路径，引擎以裸文件名读字典直接 os error 2（OCR 全链路不可用）。
# 模型缓存目录：$OAR_HOME（默认 ~/.oar），文件存在且 sha256 校验通过时零网络命中。
# 内存图像 OCR（TD-025）：oar-ocr 的 predict 接收 image::RgbImage，实时链路避免磁盘临时 BMP；
# 版本与 oar-ocr 0.9 依赖的 image 0.25.6 对齐，否则类型不兼容（同 crate 不同版本是两个类型）
image = "0.25"
# 模型自动下载（ADR-003 模型分发；rustls TLS，hf-mirror 国内镜像）
# v0.6.0 M1（REQ-085）：json feature——AI 文本复核 chat/completions 请求体
# 经 send_json 直发（否则需手拼 body + Content-Type）
ureq = { version = "2", features = ["tls", "json"] }
# 课件预热（REQ-040 M5）：PPTX = zip + slide XML 文本层提取（最小版；PDF 留 v0.5）
zip = "2"
# v0.7.0 M1（REQ-104/132）：剪贴板轮询监听（文本信号 + 图片直贴）；
# arboard 3.x 在 Windows 用 clipboard-win 实现，无额外系统依赖
arboard = "3"
fsrs = { version = "6.6.1", default-features = false }
# v0.11.1 审查修复：碎片图片 IPC 传输改 base64（原数字数组序列化 10MB 图≈35MB JSON，
# 剪贴板捕获卡顿）；版本已在依赖树锁内（零新增下载）
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# Windows 系统 API：窗口/进程枚举（课堂助手目标窗口选择）；版本与 tauri 依赖树对齐避免重复编译
# v0.2.0（ADR-001）：Win32_Media_Audio + Win32_System_Com 用于 WASAPI 端点环回捕获
# v0.2.0（ADR-002）：Win32_Graphics_* + Win32_Graphics_Gdi 用于 DXGI 屏幕捕获与 GDI 降级
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # v0.3.0（ADR-008）：MultiByteToWideChar CP936 用于外挂字幕 GBK 解码
    "Win32_Globalization",
    # v0.4.0（ADR-009）：AddDllDirectory/SetDefaultDllDirectories 把 CUDA 运行时
    # 目录加入 DLL 搜索路径（onnxruntime.dll 依赖 cudart/cublas/cudnn 等，不复制进 target）
    "Win32_System_LibraryLoader",
    # v0.4.0（REQ-042 M7）：GetDiskFreeSpaceExW 磁盘健康巡检（写满崩溃是最常见隐性故障）
    "Win32_Storage_FileSystem",
    # v0.7.0（2026-08 用户需求）：DwmGetWindowAttribute(DWMWA_CLOAKED) 过滤
    # cloaked 窗口（UWP/Edge 悬浮层被 DWM 隐藏但 IsWindowVisible 误报）
    "Win32_Graphics_Dwm",
    # v0.8.0 M1（REQ-138）：AI 密钥安全存储——DPAPI CryptProtectData/
    # CryptUnprotectData（Windows Credential 保护；明文红线：密钥不落 SQLite/
    # 明文文件）。keyring spike 因本机 TLS 拦截（crates.io 新依赖下载失败）
    # 跳过，直接走规划裁决的 DPAPI fallback 路径（ADR-016）
    "Win32_Security_Cryptography",
    # v0.12.0 M2（WGC 窗口级捕获，ADR-022）：Windows.Graphics.Capture WinRT——
    # 窗口级桌面捕获（GraphicsCaptureItem / Direct3D11CaptureFramePool /
    # FrameArrived 异步回调 → 通道同步化）
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
] }

