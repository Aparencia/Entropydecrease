[package]
name = "entropydecrease"
version = "0.4.0"
description = "熵减 - 视频知识提取与持久化（本地优先）"
authors = ["Aparencia"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# ADR-009（v0.4.0 M1）：OCR CUDA EP 编译开关（默认开）——ORT 1.28 官方 gpu_cuda12
# 运行时存在（download-ort-cuda.ps1 分发）；feature 关闭时 CUDA 请求显式失败并
# 回退 CPU（record fallback_reason），保证 CPU-only 环境零 CUDA 依赖。
default = ["ocr-cuda"]
ocr-cuda = ["oar-ocr/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sherpa-onnx = "1.13"
oar-ocr = { version = "0.9", features = ["auto-download"] }
# 内存图像 OCR（TD-025）：oar-ocr 的 predict 接收 image::RgbImage，实时链路避免磁盘临时 BMP；
# 版本与 oar-ocr 0.9 依赖的 image 0.25.6 对齐，否则类型不兼容（同 crate 不同版本是两个类型）
image = "0.25"
# 模型自动下载（ADR-003 模型分发；rustls TLS，hf-mirror 国内镜像）
ureq = { version = "2", features = ["tls"] }
# 课件预热（REQ-040 M5）：PPTX = zip + slide XML 文本层提取（最小版；PDF 留 v0.5）
zip = "2"

[dev-dependencies]
tempfile = "3"

# Windows 系统 API：窗口/进程枚举（课堂助手目标窗口选择）；版本与 tauri 依赖树对齐避免重复编译
# v0.2.0（ADR-001）：Win32_Media_Audio + Win32_System_Com 用于 WASAPI 端点环回捕获
# v0.2.0（ADR-002）：Win32_Graphics_* + Win32_Graphics_Gdi 用于 DXGI 屏幕捕获与 GDI 降级
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # v0.3.0（ADR-008）：MultiByteToWideChar CP936 用于外挂字幕 GBK 解码
    "Win32_Globalization",
    # v0.4.0（ADR-009）：AddDllDirectory/SetDefaultDllDirectories 把 CUDA 运行时
    # 目录加入 DLL 搜索路径（onnxruntime.dll 依赖 cudart/cublas/cudnn 等，不复制进 target）
    "Win32_System_LibraryLoader",
    # v0.4.0（REQ-042 M7）：GetDiskFreeSpaceExW 磁盘健康巡检（写满崩溃是最常见隐性故障）
    "Win32_Storage_FileSystem",
] }

