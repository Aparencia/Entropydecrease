<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>熵减 · 本地知识提取</title>
    <!-- J1-2：body 的 UA 8px margin + 无高度基准 ⇒ 整窗常驻纵向滚动条/底缘白条。
         reset 放 index.html 而不是 tokens.css：tokens.css 是生成物（改它会被 drift 测试判失败），
         而 reset 是**文档结构**约定，不是设计 token。 -->
    <style>
      html, body, #root { margin: 0; height: 100%; }
      /* 规格 §1 决策 17：细滚动条 6px。**只用 ::-webkit-scrollbar**：Chromium ≥121 里
         `scrollbar-width` 一旦非 auto 就使 webkit 伪元素的宽度失效（实测 10px ≠ 6px），
         而本应用是 Tauri/WebView2（仅 Chromium）—— 没有 Firefox 面需要它，别加回来。 */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: #c9c4b8; border-radius: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
