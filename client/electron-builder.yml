# Electron Builder 打包配置 - 熵减桌面端
appId: com.entropydecrease.app
productName: "Entropy decrease"
# 双发布源：第一项（generic = CDN，dl 域名，源站 OSS）被写入 app-update.yml 作为
# electron-updater 的自动更新源；GitHub 保留为开源分发/灾备源。
# 此处即最终值：CI 不再改写（历史上的 DOWNLOAD_BASE_URL sed 改写已移除），
# 本地打包与 CI 打包产物的更新源完全一致；换域名直接改本文件。
# 注意：存量客户端的 app-update.yml 仍指向 GitHub/ECS 旧源，过渡期内
# GitHub Release 资产（含 latest.yml）与 ECS 侧不可停发，否则存量用户无法升级到新源。
publish:
  - provider: generic
    url: https://dl.entropydecrease.com/downloads
  - provider: github
    owner: Aparencia
    repo: Entropydecrease
# 统一产物命名（无空格）：避免默认 "Entropy decrease Setup x.y.z.exe"
# 在 URL/服务器文件名中产生空格转义问题
directories:
  output: release
  buildResources: build
artifactName: "Entropydecrease-Setup-${version}.${ext}"
asarUnpack:
  - "**/*.node"
files:
  - dist/**/*
  - dist-electron/**/*
  - app-icon.png
  # 进程环回原生模块（ADR-001）：仅打包编译产物，不带 src/node_modules。
  # 经上方 asarUnpack 解到 app.asar.unpacked/，processAudioNative 按此路径加载；
  # 未编译时此匹配为空，应用仍可正常启动（降级为端点环回）
  - native/process-audio/build/Release/*.node
# 图标说明：
#   app-icon.png 为统一源文件（1024x1024 方形 PNG）。
#   electron-builder 会自动将其转换为各平台所需格式：
#     - Windows: .ico（含多分辨率）
#     - macOS: .icns
#     - Linux: 多分辨率 PNG
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: app-icon.png
mac:
  icon: app-icon.png
linux:
  icon: app-icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # installerIcon/uninstallerIcon/installerHeaderIcon 省略
  # electron-builder 会自动从 win.icon 派生 NSIS 所需的 .ico 文件
  createDesktopShortcut: true
  shortcutName: "Entropy decrease"
  perMachine: false
  language: "2052"
