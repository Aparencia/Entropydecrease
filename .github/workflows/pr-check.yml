name: PR Quality Check

on:
  pull_request:
    branches: [main, dev]

jobs:
  # ===========================================================================
  # 路径变更检测 —— 决定哪些子项目需要执行检查
  # ===========================================================================
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter 需要读取 PR 变更文件列表；Dependabot PR 的只读 token
    # 默认不含该权限，显式声明后 Dependabot PR 的路径检测才能正常工作
    permissions:
      contents: read
      pull-requests: read
    outputs:
      client: ${{ steps.filter.outputs.client }}
      sync-service: ${{ steps.filter.outputs.sync-service }}
      ai-gateway: ${{ steps.filter.outputs.ai-gateway }}
      website: ${{ steps.filter.outputs.website }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
            sync-service:
              - 'server/sync-service/**'
              - 'server/shared/**'
            ai-gateway:
              - 'server/ai-gateway/**'
              - 'server/shared/**'
            website:
              - 'website/**'
            docs:
              - 'docs/**'
              - 'scripts/docs-check.mjs'
              - '.docscheckignore'

  # ===========================================================================
  # Client —— React + Vite + Electron 前端
  # ===========================================================================
  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - name: Lint
        # --deny-warnings：2026-08 已清零全部 warning，此后新 warning 视为失败，
        # 防止 lint 债务回潮（审计 #4）
        run: cd client && npx oxlint --deny-warnings
      - name: Typecheck (renderer)
        # 渲染进程（React + Vite）的 TypeScript 编译检查
        run: cd client && npm run typecheck
      # Electron 主进程使用独立的 tsconfig（CommonJS / Node 目标），
      # 与渲染进程的 Vite+DOM 配置不同，需单独检查以捕获主进程类型错误
      - name: Typecheck (Electron main process)
        run: cd client && npm run typecheck:electron
      - name: Test (with coverage)
        # 启用覆盖率收集，与 vitest.config.ts 中配置的阈值配合，
        # 确保新增代码的测试覆盖不低于设定门槛
        run: cd client && npm run test -- --run --coverage
      - name: Build
        run: cd client && npm run build
      - name: Audit (client)
        # 供应链漏洞扫描：默认 registry 为 npmmirror 不支持 advisories API，
        # 显式指定官方 registry（见 migration-spec §15.5）
        run: cd client && npm audit --registry=https://registry.npmjs.org --audit-level=high

  # ===========================================================================
  # Server / sync-service —— Go + Gin 同步服务
  # ===========================================================================
  sync-service:
    needs: changes
    if: needs.changes.outputs.sync-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/sync-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 与 go.mod 的 go 1.25 指令一致（此前注释"1.25 尚未发布"已过时）
          go-version: '1.25'
          cache-dependency-path: server/sync-service/go.sum
      - name: Lint (go vet)
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -v -count=1

  # ===========================================================================
  # Server / ai-gateway —— Python + FastAPI AI 网关
  # ===========================================================================
  ai-gateway:
    needs: changes
    if: needs.changes.outputs.ai-gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/ai-gateway/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx
      - name: Lint (ruff)
        run: ruff check .
      - name: Test
        run: pytest tests/ -v --tb=short

  # ===========================================================================
  # Website —— Next.js 官网
  # ===========================================================================
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # ===========================================================================
  # Docs —— 文档体系一致性检查（链接/索引/命名）
  # ===========================================================================
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Docs check
        # 相对链接完整性 + 索引覆盖 + 命名规范（历史快照豁免见 docs/.docscheckignore）
        run: node scripts/docs-check.mjs
